name: browser-facebook-smoke
on:
  push:
    branches:
      - test/cobalt-facebook
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Browser resolve Facebook
        run: |
          python - <<'PY'
          import asyncio
          from urllib.parse import urlparse
          from downloader.browser_media_resolver import resolve
          def validator(u):
              p=urlparse(u)
              if p.scheme not in {"http","https"} or not p.hostname:
                  raise ValueError("invalid")
          async def main():
              xs=await resolve("https://www.facebook.com/reel/2115871489331970", validator=validator, timeout_ms=25000, settle_ms=2500, max_candidates=8, max_pages=6)
              print("CANDIDATES", len(xs))
              for x in xs: print(x[:1000])
              if not xs: raise SystemExit(2)
          asyncio.run(main())
          PY
