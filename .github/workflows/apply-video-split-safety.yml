name: Apply video split safety fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch splitter safely
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('bot.py')
          text = path.read_text(encoding='utf-8')

          old = '''        if not os.path.isfile(output_file):\n            raise RuntimeError(\n                f"FFmpeg did not create: {output_file}"\n            )\n'''
          new = '''        if not os.path.isfile(output_file):\n            raise RuntimeError(\n                f"FFmpeg did not create: {output_file}"\n            )\n\n        try:\n            output_size = os.path.getsize(output_file)\n        except OSError as exc:\n            raise RuntimeError(\n                f"Could not inspect FFmpeg output: {output_file}"\n            ) from exc\n\n        if output_size <= 0:\n            try:\n                os.remove(output_file)\n            except OSError:\n                pass\n\n            retry_process = await asyncio.create_subprocess_exec(\n                "ffmpeg",\n                "-y",\n                "-hide_banner",\n                "-loglevel",\n                "error",\n                "-i",\n                source_file,\n                "-ss",\n                f"{start_time:.3f}",\n                "-t",\n                f"{part_duration:.3f}",\n                "-map",\n                "0",\n                "-c",\n                "copy",\n                "-reset_timestamps",\n                "1",\n                output_file,\n                stdout=asyncio.subprocess.PIPE,\n                stderr=asyncio.subprocess.PIPE,\n            )\n\n            _, retry_stderr = await retry_process.communicate()\n\n            if retry_process.returncode != 0:\n                raise RuntimeError(\n                    "FFmpeg split retry failed: "\n                    + retry_stderr.decode(\n                        "utf-8",\n                        errors="replace",\n                    ).strip()\n                )\n\n            if (\n                not os.path.isfile(output_file)\n                or os.path.getsize(output_file) <= 0\n            ):\n                raise RuntimeError(\n                    f"FFmpeg produced an empty split part: {output_file}"\n                )\n'''

          if old not in text:
              raise SystemExit('Expected create_part output guard was not found')
          if new in text:
              raise SystemExit(0)
          text = text.replace(old, new, 1)

          old2 = '''        source_size = os.path.getsize(source_file)\n\n        if source_size <= max_part_bytes:\n            final_files.append(source_file)\n            return\n'''
          new2 = '''        try:\n            source_size = os.path.getsize(source_file)\n        except OSError as exc:\n            raise RuntimeError(\n                f"Could not inspect split part: {source_file}"\n            ) from exc\n\n        if source_size <= 0:\n            try:\n                os.remove(source_file)\n            except OSError:\n                pass\n            raise RuntimeError(\n                f"Empty split part rejected before delivery: {source_file}"\n            )\n\n        if source_size <= max_part_bytes:\n            final_files.append(source_file)\n            return\n'''

          if old2 not in text:
              raise SystemExit('Expected process_part size guard was not found')
          text = text.replace(old2, new2, 1)

          old3 = '''    if not final_files:\n        raise RuntimeError("No final video parts were created")\n\n    final_files.sort()\n\n    return final_files\n'''
          new3 = '''    if not final_files:\n        raise RuntimeError("No final video parts were created")\n\n    final_files.sort()\n\n    # Final hard validation: Telegram must never receive an empty part.\n    validated_files = []\n    for part_file in final_files:\n        if not os.path.isfile(part_file):\n            raise RuntimeError(\n                f"Video part disappeared before delivery: {part_file}"\n            )\n\n        try:\n            part_size = os.path.getsize(part_file)\n        except OSError as exc:\n            raise RuntimeError(\n                f"Could not inspect final video part: {part_file}"\n            ) from exc\n\n        if part_size <= 0:\n            try:\n                os.remove(part_file)\n            except OSError:\n                pass\n            raise RuntimeError(\n                f"Empty video part rejected before Telegram delivery: {part_file}"\n            )\n\n        if part_size > max_part_bytes:\n            raise RuntimeError(\n                f"Video part exceeds Telegram-safe limit: {part_size} bytes"\n            )\n\n        validated_files.append(part_file)\n\n    return validated_files\n'''

          if old3 not in text:
              raise SystemExit('Expected final video validation block was not found')
          text = text.replace(old3, new3, 1)

          path.write_text(text, encoding='utf-8')
          print('Patched bot.py')
          PY

      - name: Add regression tests
        run: |
          mkdir -p tests
          cat > tests/test_video_split_safety.py <<'PY'
          from pathlib import Path

          
          BOT_SOURCE = Path("bot.py").read_text(encoding="utf-8")

          
          def test_splitter_rejects_empty_ffmpeg_output():
              assert "FFmpeg produced an empty split part" in BOT_SOURCE
              assert "output_size <= 0" in BOT_SOURCE

          
          def test_splitter_rejects_empty_source_part():
              assert "Empty split part rejected before delivery" in BOT_SOURCE

          
          def test_splitter_hard_validates_final_parts():
              assert "Empty video part rejected before Telegram delivery" in BOT_SOURCE
              assert "Video part exceeds Telegram-safe limit" in BOT_SOURCE
          PY
          python -m py_compile bot.py
          python -m pytest -q tests/test_video_split_safety.py

      - name: Commit and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bot.py tests/test_video_split_safety.py
          git diff --cached --check
          git commit -m 'Fix empty video split parts before Telegram delivery'
          git rm .github/workflows/apply-video-split-safety.yml
          git commit -m 'Remove temporary video split patch workflow'
          git push
