name: Apply Shhaiid4u browser handoff repair

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: "!contains(github.event.head_commit.message, 'chore: finalize Shhaiid4u browser handoff repair')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply bounded repair
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("downloader/browser_download_handoff.py")
          text = path.read_text(encoding="utf-8")

          old = '''DEFAULT_MAX_PAGES = 4
DEFAULT_MAX_MEDIA_RESPONSES = 80'''
          new = '''DEFAULT_MAX_PAGES = 6
DEFAULT_MAX_MEDIA_RESPONSES = 100'''
          if old not in text:
              raise SystemExit("expected pagination constants not found")
          text = text.replace(old, new, 1)

          old = '''def _is_media_response(url: str, content_type: str | None, disposition: str | None) -> bool:
    ct = (content_type or "").lower()
    cd = (disposition or "").lower()
    return "attachment" in cd or ct.startswith("video/") or ct.startswith("audio/") or _looks_like_media(url)'''
          new = '''def _is_media_response(url: str, content_type: str | None, disposition: str | None) -> bool:
    # Provider endpoints can use .mp4 paths while returning HTML. Trust headers first.
    ct = (content_type or "").lower().split(";", 1)[0].strip()
    cd = (disposition or "").lower()
    if ct in {"text/html", "application/xhtml+xml"}:
        return "attachment" in cd
    return (
        "attachment" in cd
        or ct.startswith("video/")
        or ct.startswith("audio/")
        or ct in {
            "application/octet-stream",
            "application/vnd.apple.mpegurl",
            "application/dash+xml",
        }
        or _looks_like_media(url)
    )'''
          if old not in text:
              raise SystemExit("expected media classifier not found")
          text = text.replace(old, new, 1)

          marker = '''async def _stream_with_browser_context(url: str, output_dir: str, *, cookies: list[dict], referer_url: str | None, is_audio: bool, max_file_bytes: int, timeout_s: float, min_bytes: int = DEFAULT_MIN_VIDEO_BYTES, min_duration: float = DEFAULT_MIN_VIDEO_DURATION) -> str | None:'''
          helper = '''async def _resource_urls(page) -> list[str]:
    try:
        rows = await page.evaluate("() => performance.getEntriesByType('resource').map(e => e.name).filter(Boolean)")
    except Exception:
        return []
    result = []
    seen = set()
    for value in rows or []:
        if not isinstance(value, str) or not _is_http_url(value) or value in seen:
            continue
        seen.add(value)
        if _looks_like_media(value):
            result.append(value)
    return result[:32]


'''
          if marker not in text:
              raise SystemExit("stream marker not found")
          text = text.replace(marker, helper + marker, 1)

          old = '''                    if _is_media_response(response_url, content_type, disposition):
                        try:
                            validator(response_url)'''
          new = '''                    if not _is_media_response(response_url, content_type, disposition):
                        if _looks_like_media(response_url) and (content_type or "").lower().startswith(("text/html", "application/xhtml+xml")):
                            print(
                                f"🌐 Browser Download Handoff: candidate returned HTML; switching to page discovery "
                                f"content_type={content_type or 'unknown'}",
                                flush=True,
                            )
                        return
                    try:
                        validator(response_url)'''
          if old not in text:
              raise SystemExit("response handler marker not found")
          text = text.replace(old, new, 1)

          old = '''                    for media_url in dom_rows or []:
                        if isinstance(media_url, str) and _is_http_url(media_url):
                            try:
                                validator(media_url)
                            except Exception:
                                continue
                            remember_media(media_url)
                    for download in download_holder:'''
          new = '''                    for media_url in dom_rows or []:
                        if isinstance(media_url, str) and _is_http_url(media_url):
                            try:
                                validator(media_url)
                            except Exception:
                                continue
                            remember_media(media_url)

                    for resource_url in await _resource_urls(page):
                        try:
                            validator(resource_url)
                        except Exception:
                            continue
                        remember_media(resource_url)

                    for download in download_holder:'''
          if old not in text:
              raise SystemExit("DOM discovery marker not found")
          text = text.replace(old, new, 1)

          old = '''                    for link in await _candidate_links(page, page_url):
                        if link not in visited and link not in queue:
                            queue.append(link)'''
          new = '''                    for link in await _candidate_links(page, page_url):
                        if link not in visited and link not in queue:
                            queue.append(link)
                    if queue:
                        print(
                            f"🌐 Browser Download Handoff: discovered {len(queue)} follow-up page(s)",
                            flush=True,
                        )'''
          if old not in text:
              raise SystemExit("candidate queue marker not found")
          text = text.replace(old, new, 1)

          path.write_text(text, encoding="utf-8")
          PY

      - name: Validate
        run: |
          python -m py_compile downloader/browser_download_handoff.py
          python -m py_compile downloader/shhaiid4u_provider_adapters.py
          python -m py_compile downloader/shhaiid4u_provider_downloader.py
          git diff --check

      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloader/browser_download_handoff.py
          git diff --cached --quiet && exit 0
          git commit -m "chore: finalize Shhaiid4u browser handoff repair"
          git push
