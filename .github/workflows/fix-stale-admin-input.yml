name: Fix stale admin input routing

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix stale admin add-user state
        run: python3 - <<'PY'
from pathlib import Path

path = Path('bot.py')
text = path.read_text(encoding='utf-8')

old = '''    if context.user_data.get(
        "waiting_admin_add_user"
    ):

        await process_admin_add_user(
            update,
            context
        )

        return
'''

new = '''    if context.user_data.get(
        "waiting_admin_add_user"
    ):
        message_text = (update.message.text or "").strip()

        # A stale admin add-user state must never intercept normal video URLs.
        if not re.match(r"^https?://", message_text, re.IGNORECASE):
            await process_admin_add_user(
                update,
                context
            )
            return

        # Clear the stale state and let the normal URL/download handler continue.
        context.user_data["waiting_admin_add_user"] = False
'''

if new in text:
    print('Fix already present; nothing to do.')
    raise SystemExit(0)

if old not in text:
    raise RuntimeError('Expected admin add-user routing block was not found; refusing to modify bot.py')

text = text.replace(old, new, 1)
path.write_text(text, encoding='utf-8')
print('Stale admin input routing fixed.')
PY

      - name: Validate Python syntax
        run: python3 -m py_compile bot.py

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot.py
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "fix: prevent stale admin input from intercepting video URLs"
            git push
          fi
