name: facebook-fix-smoke

on:
  push:
    branches:
      - fix/facebook-impersonation-recovery

jobs:
  facebook-download-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install yt-dlp stack
        run: python -m pip install -r requirements.txt
      - name: Inspect Facebook page with curl-cffi
        run: |
          python - <<'PY'
          import re
          from curl_cffi import requests
          url = "https://www.facebook.com/reel/2115871489331970"
          r = requests.get(url, impersonate="chrome", timeout=30, allow_redirects=True)
          print("HTTP", r.status_code, "FINAL", r.url, "BYTES", len(r.content))
          text = r.text
          for key in ("playable_url", "browser_native_hd_url", "browser_native_sd_url", "og:video"):
              print(key, text.lower().count(key.lower()))
          urls = re.findall(r'https?://[^"\\\'<> ]+?(?:\\u0026|\\&|&)?', text)
          media = [u.replace("\\/", "/") for u in urls if any(x in u.lower() for x in (".mp4", ".m3u8", "video"))]
          print("MEDIA_URL_CANDIDATES", len(media))
          for u in media[:10]:
              print(u[:500])
          PY
      - name: Test pinned yt-dlp impersonation
        continue-on-error: true
        run: |
          yt-dlp --impersonate chrome-99 --no-playlist --max-filesize 49M             -o "/tmp/facebook-%(id)s.%(ext)s"             "https://www.facebook.com/reel/2115871489331970"
      - name: Test yt-dlp nightly
        run: |
          python -m pip install --upgrade --pre yt-dlp
          yt-dlp --version
          yt-dlp --impersonate chrome-99 --no-playlist --max-filesize 49M             -o "/tmp/facebook-nightly-%(id)s.%(ext)s"             "https://www.facebook.com/reel/2115871489331970"
