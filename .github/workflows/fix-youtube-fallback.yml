name: Apply YouTube fallback safety fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch YouTube fallback policy
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('bot.py')
          text = path.read_text(encoding='utf-8')

          old = '''            # ------------------------------------------------
            # Smart Extraction fallback
            # يتم تجربته فقط بعد فشل yt-dlp الأساسي.
            # ------------------------------------------------

            smart_file, smart_diagnostics = await download_with_smart_extraction(
                url=url,
                temp_dir=temp_dir,
                output_template=output_template,
                format_option=format_option,
                is_audio=is_audio,
                attempt_id=attempt_id,
                attempt_number=attempt_number,
            )
'''

          new = '''            # ------------------------------------------------
            # Smart Extraction fallback
            # يتم تجربته فقط بعد فشل yt-dlp الأساسي.
            #
            # YouTube must never enter the generic HTML/direct-media
            # extraction layer. That layer is intentionally generic and
            # can discover unrelated media embedded in a YouTube page
            # (for example promotional/embedded assets). For YouTube,
            # yt-dlp is the authoritative extractor and Yoinku remains
            # the bounded fallback if yt-dlp fails.
            # ------------------------------------------------

            if is_youtube:
                smart_file = None
                smart_diagnostics = {
                    "candidate_count": 0,
                    "valid_candidate_count": 0,
                    "skipped": "youtube_smart_extraction_not_applicable",
                }
                print(
                    "ℹ️ Skipping generic Smart Extraction fallback for YouTube"
                )
            else:
                smart_file, smart_diagnostics = await download_with_smart_extraction(
                    url=url,
                    temp_dir=temp_dir,
                    output_template=output_template,
                    format_option=format_option,
                    is_audio=is_audio,
                    attempt_id=attempt_id,
                    attempt_number=attempt_number,
                )
'''

          if old not in text:
              raise SystemExit('Target YouTube Smart Extraction block not found; aborting without changes.')

          if 'youtube_smart_extraction_not_applicable' in text:
              raise SystemExit('YouTube fallback safety fix is already present; aborting without changes.')

          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Validate Python syntax
        run: python -m py_compile bot.py

      - name: Commit patch and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bot.py
          git rm .github/workflows/fix-youtube-fallback.yml
          git commit -m 'fix: prevent generic fallback from handling YouTube'
          git push
