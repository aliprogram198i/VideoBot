name: apply-youtube-fix

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply minimal YouTube fallback isolation
        shell: python
        run: |
          from pathlib import Path

          path = Path("bot.py")
          text = path.read_text(encoding="utf-8")
          marker = "youtube_smart_extraction_not_applicable"

          if marker in text:
              print("YouTube fallback isolation already applied")
              raise SystemExit(0)

          old = '''            smart_file, smart_diagnostics = await download_with_smart_extraction(
                url=url,
                temp_dir=temp_dir,
                output_template=output_template,
                format_option=format_option,
                is_audio=is_audio,
            )
'''

          new = '''            if is_youtube:
                smart_file = None
                smart_diagnostics = {
                    "candidate_count": 0,
                    "valid_candidate_count": 0,
                    "skipped": "youtube_smart_extraction_not_applicable",
                }
                print("ℹ️ Skipping generic Smart Extraction fallback for YouTube")
            else:
                smart_file, smart_diagnostics = await download_with_smart_extraction(
                    url=url,
                    temp_dir=temp_dir,
                    output_template=output_template,
                    format_option=format_option,
                    is_audio=is_audio,
                )
'''

          if text.count(old) != 1:
              raise SystemExit(f"Expected exactly one target block, found {text.count(old)}")

          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          print("Applied minimal YouTube fallback isolation")

      - name: Verify syntax
        run: python -m py_compile bot.py

      - name: Commit source fix
        shell: bash
        run: |
          if git diff --quiet -- bot.py; then
            echo "No source change to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot.py
          git commit -m "fix: isolate YouTube from generic smart extraction fallback"
          git push origin HEAD:main
