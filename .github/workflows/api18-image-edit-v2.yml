name: Apply Api18 image editor v2

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply patch
        run: python3 .github/scripts/apply_api18_image_edit.py

      - name: Validate
        run: |
          python3 -m py_compile bot.py
          git diff --check

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot.py
          if git diff --cached --quiet; then
            echo "No changes required."
            exit 0
          fi
          git commit -m "feat: add admin Api18 image editing"
          git push
