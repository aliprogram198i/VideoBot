name: apply-krx18-frame-media-fix
on:
  push:
    branches: [tmp/krx18-frame-patch-run]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch browser resolver
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('downloader/browser_media_resolver.py')
          s = p.read_text()
          old = '''def _is_http_url(value: str) -> bool:\n    try:\n        parsed = urlparse(value)\n    except Exception:\n        return False\n    return parsed.scheme in {"http", "https"} and bool(parsed.hostname)\n\n\ndef _is_media_response'''
          new = '''def _is_http_url(value: str) -> bool:\n    try:\n        parsed = urlparse(value)\n    except Exception:\n        return False\n    return parsed.scheme in {"http", "https"} and bool(parsed.hostname)\n\n\ndef _is_krx18_host(value: str) -> bool:\n    try:\n        host = (urlparse(value).hostname or "").lower().rstrip(".")\n    except Exception:\n        return False\n    return host == "krx18.com" or host.endswith(".krx18.com")\n\n\ndef _looks_like_krx18_media_url(value: str) -> bool:\n    try:\n        parsed = urlparse(value)\n        haystack = f"{parsed.path}?{parsed.query}".lower()\n    except Exception:\n        return False\n    return any(marker in haystack for marker in (\n        "stream", "media", "video", "source", "player", "playlist",\n        "download", "direct", "file", ".m3u8", ".mpd",\n    ))\n\n\ndef _is_media_response'''
          if old not in s:
              raise SystemExit('anchor 1 not found')
          s = s.replace(old, new, 1)
          old = '''async def _click_server_controls(page, max_clicks: int) -> None:\n    """Click only server/player/download controls; never arbitrary page buttons."""'''
          new = '''async def _click_server_controls(page, max_clicks: int, *, wait_after: bool = True) -> None:\n    """Click only server/player/download controls; never arbitrary page buttons."""'''
          if old not in s:
              raise SystemExit('anchor 2 not found')
          s = s.replace(old, new, 1)
          old = '''            await control.click(timeout=1800, no_wait_after=True)\n            await page.wait_for_timeout(500)\n        except Exception:\n            continue\n\n\nasync def _collect_dom_media'''
          new = '''            await control.click(timeout=1800, no_wait_after=True)\n            if wait_after:\n                await page.wait_for_timeout(500)\n        except Exception:\n            continue\n\n\nasync def _collect_frame_media(page, validator, candidates: dict[str, tuple[int, str | None]], max_clicks: int) -> None:\n    """Inspect player frames directly; many sites keep the real media only there."""\n    for frame in list(page.frames):\n        if frame is page.main_frame:\n            continue\n        try:\n            await _collect_dom_media(frame, validator, candidates)\n            await _collect_script_media(frame, validator, candidates)\n            await _click_server_controls(frame, max_clicks, wait_after=False)\n            await _collect_dom_media(frame, validator, candidates)\n            await _collect_script_media(frame, validator, candidates)\n        except Exception:\n            continue\n\n\nasync def _collect_dom_media'''
          if old not in s:
              raise SystemExit('anchor 3 not found')
          s = s.replace(old, new, 1)
          old = '''                    if not _is_media_response(response_url, content_type, content_disposition): return\n                    try: validator(response_url)\n                    except Exception: return\n                    score = _score(response_url, content_type) + (25 if content_disposition and "attachment" in content_disposition.lower() else 0)'''
          new = '''                    is_media = _is_media_response(response_url, content_type, content_disposition)\n                    if not is_media and not (_is_krx18_host(url) and _looks_like_krx18_media_url(response_url)):\n                        return\n                    try: validator(response_url)\n                    except Exception: return\n                    score = _score(response_url, content_type) + (8 if not is_media else 0) + (25 if content_disposition and "attachment" in content_disposition.lower() else 0)'''
          if old not in s:
              raise SystemExit('anchor 4 not found')
          s = s.replace(old, new, 1)
          old = '''                    await _collect_dom_media(page, validator, candidates)\n                    await _collect_script_media(page, validator, candidates)\n\n                    targets = await _discover_navigation_targets(page, page_url, max_nav_targets)'''
          new = '''                    await _collect_dom_media(page, validator, candidates)\n                    await _collect_script_media(page, validator, candidates)\n                    await _collect_frame_media(page, validator, candidates, max_server_clicks)\n\n                    targets = await _discover_navigation_targets(page, page_url, max_nav_targets)'''
          if old not in s:
              raise SystemExit('anchor 5 not found')
          s = s.replace(old, new, 1)
          old = '''                    await _click_server_controls(page, max_server_clicks)\n                    await page.wait_for_timeout(settle_ms)\n                    await _collect_dom_media(page, validator, candidates)\n                    await _collect_script_media(page, validator, candidates)\n\n                    frame_urls = []'''
          new = '''                    await _click_server_controls(page, max_server_clicks)\n                    await page.wait_for_timeout(settle_ms)\n                    await _collect_dom_media(page, validator, candidates)\n                    await _collect_script_media(page, validator, candidates)\n                    await _collect_frame_media(page, validator, candidates, max_server_clicks)\n\n                    frame_urls = []'''
          if old not in s:
              raise SystemExit('anchor 6 not found')
          s = s.replace(old, new, 1)
          old = '''                    for target in targets:\n                        if target not in visited_pages and target not in queue: queue.append(target)\n\n                    # Important: click download/server controls BEFORE leaving the page.'''
          new = '''                    for target in targets:\n                        if target not in visited_pages and target not in queue: queue.append(target)\n\n                    # Important: click download/server controls BEFORE leaving the page.'''
          # Keep target discovery unchanged; frame prioritization is applied after dynamic frame discovery below.
          if old not in s:
              raise SystemExit('anchor 7 not found')
          old = '''                    for frame_url in frame_urls[:max_nav_targets]:\n                        if frame_url not in queue: queue.append(frame_url)'''
          new = '''                    for frame_url in reversed(frame_urls[:max_nav_targets]):\n                        if frame_url not in visited_pages and frame_url not in queue:\n                            queue.insert(0, frame_url)'''
          if old not in s:
              raise SystemExit('anchor 8 not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          python -m py_compile downloader/browser_media_resolver.py
      - name: Add focused regression tests
        run: |
          cat > tests/test_krx18_frame_discovery.py <<'PY'
          from downloader.browser_media_resolver import _is_krx18_host, _looks_like_krx18_media_url

          def test_krx18_host_detection_is_scoped():
              assert _is_krx18_host('https://krx18.com/movie')
              assert _is_krx18_host('https://player.krx18.com/embed')
              assert not _is_krx18_host('https://notkrx18.com/movie')

          def test_krx18_media_url_markers_are_conservative():
              assert _looks_like_krx18_media_url('https://cdn.example/video?id=1')
              assert _looks_like_krx18_media_url('https://cdn.example/player/abc')
              assert not _looks_like_krx18_media_url('https://cdn.example/banner.jpg')
          PY
          python -m pytest -q tests/test_browser_resolver_budget.py tests/test_krx18_frame_discovery.py
      - name: Commit patch and remove workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add downloader/browser_media_resolver.py tests/test_krx18_frame_discovery.py .github/workflows/apply-krx18-frame-media-fix.yml
          git commit -m 'Fix KRX18 iframe media discovery' || exit 0
          git rm .github/workflows/apply-krx18-frame-media-fix.yml
          git commit -m 'chore: remove temporary KRX18 patch workflow'
          git push origin HEAD:tmp/krx18-frame-patch-run
