name: Quality Gate

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt pytest

      - name: Compile all Python sources
        run: python -m compileall -q .

      - name: Run regression and unit suite
        run: python -m pytest -q

      - name: Build production image
        run: docker build --pull -t alibot-quality-gate:ci .

      - name: Smoke-test production image imports
        run: >
          docker run --rm --entrypoint python alibot-quality-gate:ci
          -c "import data_layer, entrypoint, downloader.smart_engine;
          print('runtime import smoke test: OK')"
