name: Instagram exact public resolver diagnostic

on:
  push:
    branches:
      - diagnostic/instagram-public-browser-smoke

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Install Playwright
        run: |
          python -m pip install playwright==1.62.0
          python -m playwright install --with-deps chromium
      - name: Probe DropZap public resolver
        env:
          TARGET: https://www.instagram.com/reel/Dcqf3AXNgfL/?stkn=MXR6c2NkZGthN3N1OQ==
        run: |
          python - <<'PY'
          import asyncio,os,re
          from playwright.async_api import async_playwright
          target=os.environ['TARGET']
          async def main():
            async with async_playwright() as pw:
              b=await pw.chromium.launch(headless=True,args=['--no-sandbox','--disable-dev-shm-usage'])
              c=await b.new_context(viewport={'width':1280,'height':900},locale='en-US')
              p=await c.new_page()
              hits=[]
              def resp(r):
                u=r.url
                if any(x in u.lower() for x in ('api','instagram','download','media')):
                  hits.append((u,r.status,r.headers.get('content-type','')))
              p.on('response',resp)
              await p.goto('https://www.dropzap.digital/instagram-downloader',wait_until='domcontentloaded',timeout=30000)
              await p.wait_for_timeout(1500)
              inp=p.locator('input[type="text"],input[type="url"],input[placeholder*="Instagram" i],textarea').first
              await inp.wait_for(timeout=15000); await inp.fill(target)
              await p.locator('button:has-text("Download"),button:has-text("Find"),button[type="submit"]').first.click()
              await p.wait_for_timeout(10000)
              html=await p.content()
              links=await p.locator('a').evaluate_all("els=>els.map(e=>e.href).filter(Boolean)")
              print('FINAL',p.url)
              print('HITS',hits[-30:])
              print('MP4_LINKS',[x for x in links if '.mp4' in x.lower()][:10])
              print('HTML_MP4_COUNT',html.lower().count('.mp4'))
              print('HTML_MARKERS',[(x,x.lower() in html.lower()) for x in ['Dcqf3AXNgfL','download video','error','private']])
              if not any('.mp4' in x.lower() for x in links) and '.mp4' not in html.lower(): raise SystemExit(2)
              await c.close(); await b.close()
          asyncio.run(main())
          PY
