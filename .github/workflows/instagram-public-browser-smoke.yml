name: Instagram exact-source diagnostics

on:
  push:
    branches:
      - diagnostic/instagram-public-browser-smoke

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Probe Instagram public media endpoints
        env:
          TARGET: https://www.instagram.com/reel/Dcqf3AXNgfL/?stkn=MXR6c2NkZGthN3N1OQ==
        run: |
          python - <<'PY'
          import base64,json,re,requests
          from urllib.parse import urlparse
          target='https://www.instagram.com/reel/Dcqf3AXNgfL/'
          code='Dcqf3AXNgfL'
          pk=str(int.from_bytes(base64.urlsafe_b64decode(code+'=='),'big'))
          headers={
            'User-Agent':'Mozilla/5.0 (Linux; Android 10; K) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Mobile Safari/537.36',
            'Accept':'application/json,text/plain,*/*','Accept-Language':'en-US,en;q=0.9',
            'Referer':target,'X-IG-App-ID':'936619743392459','X-Requested-With':'XMLHttpRequest'
          }
          urls=[
            f'https://www.instagram.com/api/v1/media/{pk}/info/',
            f'https://www.instagram.com/api/v1/media/{pk}/info/?hl=en',
          ]
          found=[]
          for u in urls:
            try:
              r=requests.get(u,headers=headers,timeout=20,allow_redirects=True)
              print('URL',u,'STATUS',r.status_code,'FINAL',r.url,'CT',r.headers.get('content-type'))
              print('BODY',r.text[:5000])
              try:
                j=r.json()
                blob=json.dumps(j)
                if 'video_versions' in blob:
                  found.append(j)
              except Exception: pass
            except Exception as e: print('ERROR',type(e).__name__,str(e))
          print('VIDEO_VERSION_RESPONSES',len(found))
          if not found: raise SystemExit(2)
          PY
