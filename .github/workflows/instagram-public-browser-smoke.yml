name: Instagram public provider smoke

on:
  push:
    branches:
      - diagnostic/instagram-public-browser-smoke

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright==1.62.0
          python -m playwright install --with-deps chromium
      - name: Test public downloader providers with exact Reel
        env:
          TARGET: https://www.instagram.com/reel/Dcqf3AXNgfL/?stkn=MXR6c2NkZGthN3N1OQ==
        run: |
          python - <<'PY'
          import asyncio, json, os, re
          from playwright.async_api import async_playwright

          target=os.environ['TARGET']

          async def run_sss(page):
              loop=asyncio.get_running_loop(); future=loop.create_future()
              def on_response(resp):
                  if future.done() or '/api/convert' not in resp.url or resp.request.method != 'POST': return
                  async def read():
                      try:
                          data=await resp.json()
                          if isinstance(data,dict) and (data.get('url') or data.get('medias')) or isinstance(data,list) and data:
                              future.set_result(data)
                          else: future.set_exception(RuntimeError('sss returned no media'))
                      except Exception as e:
                          if not future.done(): future.set_exception(e)
                  asyncio.create_task(read())
              page.on('response',on_response)
              await page.goto('https://sssinstagram.com/reels-downloader',wait_until='domcontentloaded',timeout=30000)
              inp=page.locator('input[type="text"], input[name="url"], input#main_page_text').first
              await inp.wait_for(timeout=15000); await inp.fill(target)
              await page.locator('button[type="submit"], button:has-text("Download")').first.click()
              return await asyncio.wait_for(future,timeout=30000)

          async def run_fvs(page):
              loop=asyncio.get_running_loop(); future=loop.create_future()
              def on_response(resp):
                  if future.done() or 'videodropper.app/allinone' not in resp.url: return
                  async def read():
                      try:
                          data=await resp.json()
                          if isinstance(data,dict) and (data.get('video') or data.get('image') or data.get('medias') or data.get('url')):
                              future.set_result(data)
                          else: future.set_exception(RuntimeError('fastvideosave returned no media'))
                      except Exception as e:
                          if not future.done(): future.set_exception(e)
                  asyncio.create_task(read())
              page.on('response',on_response)
              await page.goto('https://fastvideosave.net/',wait_until='domcontentloaded',timeout=30000)
              await page.wait_for_timeout(1200)
              inp=page.locator('input[type="text"], input[type="url"], input[name*="url" i], input[placeholder*="link" i], input[placeholder*="url" i]').first
              await inp.wait_for(timeout=15000); await inp.fill(target)
              await page.locator('button:has-text("Download"), button[type="submit"], button:has-text("Search"), .btn').first.click()
              return await asyncio.wait_for(future,timeout=30000)

          async def main():
              async with async_playwright() as pw:
                  browser=await pw.chromium.launch(headless=True,args=['--no-sandbox','--disable-dev-shm-usage'])
                  results={}
                  for name,fn in [('sssinstagram',run_sss),('fastvideosave',run_fvs)]:
                      context=await browser.new_context(viewport={'width':1280,'height':900},locale='en-US')
                      page=await context.new_page()
                      try:
                          data=await fn(page)
                          results[name]=data
                          print(name,'RAW',json.dumps(data)[:3000])
                      except Exception as e:
                          results[name]=None
                          print(name,'ERROR',type(e).__name__,str(e))
                      finally:
                          await context.close()
                  await browser.close()
              video_urls=[]
              def walk(v):
                  if isinstance(v,dict):
                      for k,x in v.items():
                          if k in {'url','video'} and isinstance(x,str) and x.startswith('http') and ('.mp4' in x.lower() or 'video' in k.lower()): video_urls.append(x)
                          walk(x)
                  elif isinstance(v,list):
                      for x in v: walk(x)
              for data in results.values(): walk(data)
              print('VIDEO_URL_COUNT',len(set(video_urls)))
              print('VIDEO_URLS',list(dict.fromkeys(video_urls))[:5])
              if not video_urls: raise SystemExit(2)

          asyncio.run(main())
          PY
