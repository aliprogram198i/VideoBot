name: Instagram embed diagnostic
on:
  push:
    branches: [test/instagram-embed-resolver]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          import requests,re
          from html import unescape
          code='Dcqf3AXNgfL'; u=f'https://www.instagram.com/reel/{code}/embed/'
          h={'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0 Safari/537.36','Accept':'text/html,application/xhtml+xml,application/json;q=0.9,*/*;q=0.8','Accept-Language':'en-US,en;q=0.9'}
          r=requests.get(u,headers=h,timeout=30); t=r.text
          print('STATUS',r.status_code,'LEN',len(t),'FINAL',r.url)
          for term in ['Dcqf3AXNgfL','video_versions','video_dash_manifest','video_url','playback_url','is_video','media_type','xdt_api__v1__media__shortcode__web_info','xdt_api__v1__clips__home__connection_v2','ScheduledServerJS']:
            print('TERM',term,'COUNT',t.count(term))
          for term in ['Dcqf3AXNgfL','xdt_api__v1__media__shortcode__web_info','xdt_api__v1__clips__home__connection_v2']:
            p=t.find(term)
            print('SNIP',term,'POS',p)
            if p>=0: print(unescape(t[max(0,p-1800):p+6000])[:7800])
          PY