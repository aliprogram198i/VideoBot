name: apply-krx18-dedicated-resolver

on:
  push:
    branches:
      - fix/krx18-dedicated-resolver-2026-09-15

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Apply integration patch
        run: python scripts/apply_krx18_browser_integration.py

      - name: Compile changed Python modules
        run: python -m py_compile downloader/krx18_resolver.py downloader/browser_media_resolver.py

      - name: Remove temporary patcher
        run: rm -f scripts/apply_krx18_browser_integration.py .github/workflows/apply-krx18-dedicated-resolver.yml

      - name: Commit and push
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloader/browser_media_resolver.py downloader/krx18_resolver.py scripts/apply_krx18_browser_integration.py .github/workflows/apply-krx18-dedicated-resolver.yml
          git commit -m "fix: route KRX18 through dedicated resolver" || exit 0
          git push origin HEAD:${GITHUB_REF_NAME}
