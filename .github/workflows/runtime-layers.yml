name: runtime-layers

on:
  push:
    branches:
      - main
      - 'refactor/**'
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: One-time YouTube fallback safety patch
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.head_commit.message == 'fix: prevent generic fallback from handling YouTube'
        run: |
          python - <<'PY'
          from pathlib import Path

          bot = Path('bot.py')
          text = bot.read_text(encoding='utf-8')

          old = '''            # ------------------------------------------------
            # Smart Extraction fallback
            # يتم تجربته فقط بعد فشل yt-dlp الأساسي.
            # ------------------------------------------------

            smart_file, smart_diagnostics = await download_with_smart_extraction(
                url=url,
                temp_dir=temp_dir,
                output_template=output_template,
                format_option=format_option,
                is_audio=is_audio,
                attempt_id=attempt_id,
                attempt_number=attempt_number,
            )
'''

          new = '''            # ------------------------------------------------
            # Smart Extraction fallback
            # يتم تجربته فقط بعد فشل yt-dlp الأساسي.
            #
            # YouTube must never enter the generic HTML/direct-media
            # extraction layer. That layer is intentionally generic and
            # can discover unrelated media embedded in a YouTube page
            # (for example promotional/embedded assets). For YouTube,
            # yt-dlp is the authoritative extractor and Yoinku remains
            # the bounded fallback if yt-dlp fails.
            # ------------------------------------------------

            if is_youtube:
                smart_file = None
                smart_diagnostics = {
                    "candidate_count": 0,
                    "valid_candidate_count": 0,
                    "skipped": "youtube_smart_extraction_not_applicable",
                }
                print(
                    "ℹ️ Skipping generic Smart Extraction fallback for YouTube"
                )
            else:
                smart_file, smart_diagnostics = await download_with_smart_extraction(
                    url=url,
                    temp_dir=temp_dir,
                    output_template=output_template,
                    format_option=format_option,
                    is_audio=is_audio,
                    attempt_id=attempt_id,
                    attempt_number=attempt_number,
                )
'''

          if 'youtube_smart_extraction_not_applicable' in text:
              raise SystemExit('YouTube safety patch is already present.')
          if old not in text:
              raise SystemExit('Target YouTube Smart Extraction block not found.')

          bot.write_text(text.replace(old, new, 1), encoding='utf-8')

          runtime = Path('.github/workflows/runtime-layers.yml')
          runtime.write_text('''name: runtime-layers

on:
  push:
    branches:
      - main
      - 'refactor/**'
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt pytest
      - name: Run test suite
        run: python -m pytest -q
      - name: Compile Python sources
        run: python -m compileall -q jobs security plugins database media delivery telegram_layer downloader entrypoint.py bot.py
''', encoding='utf-8')
          
          temp = Path('.github/workflows/fix-youtube-fallback.yml')
          if temp.exists():
              temp.unlink()
          PY

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        if: github.event.head_commit.message != 'fix: prevent generic fallback from handling YouTube'
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt pytest
      - name: Run test suite
        if: github.event.head_commit.message != 'fix: prevent generic fallback from handling YouTube'
        run: python -m pytest -q
      - name: Compile Python sources
        if: github.event.head_commit.message != 'fix: prevent generic fallback from handling YouTube'
        run: python -m compileall -q jobs security plugins database media delivery telegram_layer downloader entrypoint.py bot.py
      - name: Commit one-time patch
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.head_commit.message == 'fix: prevent generic fallback from handling YouTube'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bot.py .github/workflows/runtime-layers.yml
          git rm -f .github/workflows/fix-youtube-fallback.yml 2>/dev/null || true
          git commit -m 'fix: prevent generic fallback from handling YouTube'
          git push
