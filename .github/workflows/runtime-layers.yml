name: runtime-layers

on:
  push:
    branches:
      - main
      - 'refactor/**'
  pull_request:

permissions:
  contents: write

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply one-time YouTube fallback isolation
        shell: python
        run: |
          from pathlib import Path
          path = Path("bot.py")
          text = path.read_text(encoding="utf-8")
          marker = "youtube_smart_extraction_not_applicable"
          if marker in text:
              print("YouTube fallback isolation already applied")
              raise SystemExit(0)
          old = '''            smart_file, smart_diagnostics = await download_with_smart_extraction(\n                url=url,\n                temp_dir=temp_dir,\n                output_template=output_template,\n                format_option=format_option,\n                is_audio=is_audio,\n            )\n'''
          new = '''            if is_youtube:\n                smart_file = None\n                smart_diagnostics = {\n                    "candidate_count": 0,\n                    "valid_candidate_count": 0,\n                    "skipped": "youtube_smart_extraction_not_applicable",\n                }\n                print("ℹ️ Skipping generic Smart Extraction fallback for YouTube")\n            else:\n                smart_file, smart_diagnostics = await download_with_smart_extraction(\n                    url=url,\n                    temp_dir=temp_dir,\n                    output_template=output_template,\n                    format_option=format_option,\n                    is_audio=is_audio,\n                )\n'''
          if text.count(old) != 1:
              raise SystemExit(f"Expected exactly one target block, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          print("Applied minimal YouTube fallback isolation")
      - name: Verify patched source
        run: python -m py_compile bot.py
      - name: Commit source patch if needed
        shell: bash
        run: |
          if git diff --quiet -- bot.py; then
            echo "No source change to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot.py
          git commit -m "fix: isolate YouTube from generic smart extraction fallback"
          git push origin HEAD:main
      - name: Install test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt pytest
      - name: Run test suite
        run: python -m pytest -q
      - name: Compile Python sources
        run: python -m compileall -q jobs security plugins database media delivery telegram_layer downloader entrypoint.py bot.py
