name: runtime-layers

on:
  push:
    branches:
      - main
      - 'refactor/**'
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt pytest
      - name: Run test suite
        run: python -m pytest -q
      - name: Compile Python sources
        run: python -m compileall -q jobs security plugins database media delivery telegram_layer entrypoint.py bot.py
