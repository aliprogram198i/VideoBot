name: Update AliBot success messages

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-messages:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update success messages only
