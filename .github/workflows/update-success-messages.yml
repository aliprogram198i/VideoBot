for lang, keys in updates.items():
    lang_start = text.find(f'    "{lang}": {{')
    if lang_start < 0:
        raise RuntimeError(f'Missing language block: {lang}')
    next_lang = text.find('\n\n    "', lang_start + 8)
    if next_lang < 0:
        next_lang = len(text)
    block = text[lang_start:next_lang]
    for key, replacement in keys.items():
        pattern = rf'        "{re.escape(key)}":\n(?:            .*\n)+?'
        match = re.search(pattern, block)
        if not match:
            raise RuntimeError(f'Missing {lang}.{key}')
        block = block[:match.start()] + replacement + block[match.end():]
    text = text[:lang_start] + block + text[next_lang:]

if 'ALIBOT_SUCCESS_MESSAGES_V1' not in text:
    anchor = '# ============================================================\n# قاعدة البيانات'
    if anchor not in text:
        raise RuntimeError('Database section anchor not found')
    text = text.replace(anchor, '# ALIBOT_SUCCESS_MESSAGES_V1\n' + anchor, 1)

path.write_text(text, encoding='utf-8')
print('Success messages updated.')
PY

      - name: Validate Python syntax
        run: python3 -m py_compile bot.py

      - name: Commit bot.py and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot.py
          git rm -f .github/workflows/update-success-messages.yml
          git commit -m "feat: improve download completion messages"
          git push origin main
