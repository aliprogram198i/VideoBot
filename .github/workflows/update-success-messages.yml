name: Update AliBot success messages

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-messages:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply surgical message update
        run: python3 .github/update_success_messages.py

      - name: Validate Python syntax
        run: python3 -m py_compile bot.py

      - name: Commit bot.py and remove temporary files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot.py
          git rm -f .github/update_success_messages.py .github/workflows/update-success-messages.yml
          git commit -m "feat: improve download completion messages"
          git push origin main
