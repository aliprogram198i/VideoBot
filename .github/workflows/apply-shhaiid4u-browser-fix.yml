name: apply bounded Shhaiid4u browser fix

on:
  push:
    paths:
      - .github/workflows/apply-shhaiid4u-browser-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply bounded browser handoff patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('downloader/browser_download_handoff.py')
          s = p.read_text(encoding='utf-8')

          old = '''DEFAULT_MAX_PAGES = 4\nDEFAULT_MAX_MEDIA_RESPONSES = 80\n'''
          new = '''DEFAULT_MAX_PAGES = 6\nDEFAULT_MAX_MEDIA_RESPONSES = 100\n'''
          if old not in s:
              raise SystemExit('expected constants block not found')
          s = s.replace(old, new, 1)

          old = '''def _is_media_response(url: str, content_type: str | None, disposition: str | None) -> bool:\n    ct = (content_type or "").lower()\n    cd = (disposition or "").lower()\n    return "attachment" in cd or ct.startswith("video/") or ct.startswith("audio/") or _looks_like_media(url)\n'''
          new = '''def _is_media_response(url: str, content_type: str | None, disposition: str | None) -> bool:\n    ct = (content_type or "").split(";", 1)[0].strip().lower()\n    cd = (disposition or "").lower()\n    if ct in {"text/html", "application/xhtml+xml", "text/plain", "application/json"}:\n        return False\n    return "attachment" in cd or ct.startswith("video/") or ct.startswith("audio/")\n'''
          if old not in s:
              raise SystemExit('expected media classifier not found')
          s = s.replace(old, new, 1)

          marker = '''                    try:\n                        dom_rows = await page.locator("video, audio, source").evaluate_all("""els => els.map(el => el.currentSrc || el.src || el.getAttribute('src') || el.getAttribute('data-src') || el.getAttribute('data-url') || '')""")\n                    except Exception:\n                        dom_rows = []\n'''
          insert = marker + '''                    # Provider pages may construct media URLs dynamically without a\n                    # persistent <video>/<source> element. Inspect the browser's\n                    # resource timing entries as an additional, bounded discovery path.\n                    try:\n                        performance_rows = await page.evaluate("""() => performance.getEntriesByType('resource').map(entry => entry.name || '')""")\n                    except Exception:\n                        performance_rows = []\n                    for media_url in performance_rows or []:\n                        if not isinstance(media_url, str) or not _is_http_url(media_url):\n                            continue\n                        if not _looks_like_media(media_url):\n                            continue\n                        try:\n                            validator(media_url)\n                        except Exception:\n                            continue\n                        remember_media(media_url)\n'''
          if marker not in s:
              raise SystemExit('expected DOM discovery block not found')
          s = s.replace(marker, insert, 1)

          p.write_text(s, encoding='utf-8')
          PY
          python -m py_compile downloader/browser_download_handoff.py
          git diff --check
          git diff -- downloader/browser_download_handoff.py
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloader/browser_download_handoff.py
          git commit -m "fix: harden Shhaiid4u browser media discovery" || exit 0
          git push