name: Integrate Smart Operations (staging branch)

on:
  push:
    branches:
      - feature/smart-operations

permissions:
  contents: write

jobs:
  integrate:
    if: ${{ !contains(github.event.head_commit.message, '[smart-ops-integrated]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Patch bot.py safely
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('bot.py')
          text = path.read_text(encoding='utf-8')

          marker = 'from plugins.smart_operations import register_smart_operations\n'
          if marker not in text:
              anchor = 'from telegram.request import HTTPXRequest\n'
              if anchor not in text:
                  raise SystemExit('SAFE PATCH ABORTED: import anchor not found')
              text = text.replace(anchor, anchor + marker, 1)

          button = '''        [\n            InlineKeyboardButton(\n                "🤖 Smart Operations",\n                callback_data="admin_smart_operations"\n            )\n        ],\n'''
          ai_button = '''        [\n            InlineKeyboardButton(\n                "🤖 الذكاء الاصطناعي",\n                callback_data="admin_ai"\n            )\n        ],\n'''
          if 'callback_data="admin_smart_operations"' not in text:
              if ai_button not in text:
                  raise SystemExit('SAFE PATCH ABORTED: admin keyboard anchor not found')
              text = text.replace(ai_button, ai_button + button, 1)

          registration = '''    # ========================================================\n    # Smart Operations — read-only operational dashboard\n    # ========================================================\n\n    register_smart_operations(\n        app,\n        get_db,\n        ADMIN_ID\n    )\n\n'''
          if 'register_smart_operations(' not in text:
              anchor = '''    app.run_polling(\n        drop_pending_updates=True\n    )\n'''
              if anchor not in text:
                  raise SystemExit('SAFE PATCH ABORTED: run_polling anchor not found')
              text = text.replace(anchor, registration + anchor, 1)

          path.write_text(text, encoding='utf-8')
          print('Smart Operations integration patch applied safely.')
          PY

      - name: Syntax check
        run: python -m py_compile bot.py plugins/smart_operations.py

      - name: Commit integration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot.py plugins/smart_operations.py .github/workflows/integrate-smart-operations-staging.yml
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "feat(admin): integrate Smart Operations [smart-ops-integrated]"
          git push
