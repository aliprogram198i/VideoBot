for lang, block in blocks.items():
    marker = f'    "{lang}": {{'
    pos = text.find(marker)
    if pos < 0:
        raise RuntimeError(f'Missing language block: {lang}')
    share_pos = text.find('        "share":', pos)
    if share_pos < 0:
        raise RuntimeError(f'Missing share key in language block: {lang}')
    text = text[:share_pos] + block + text[share_pos:]

# 2) Add safe pending-invite table and indexes to init_db().
anchor = '''    cur.execute("""
        CREATE TABLE IF NOT EXISTS broadcast_messages (
            id INTEGER PRIMARY KEY AUTOINCREMENT,
            broadcast_id INTEGER,
            user_id INTEGER,
            message_id INTEGER,
            created_at TEXT
        )
    """)
'''
insert = anchor + '''
    # --------------------------------------------------------
    # دعوات إضافة مستخدم من لوحة الإدارة بدون اختلاق Telegram ID
    # --------------------------------------------------------
    cur.execute("""
        CREATE TABLE IF NOT EXISTS pending_user_invites (
            id INTEGER PRIMARY KEY AUTOINCREMENT,
            username TEXT NOT NULL,
            token TEXT NOT NULL UNIQUE,
            admin_id INTEGER NOT NULL,
            status TEXT NOT NULL DEFAULT 'pending',
            user_id INTEGER,
            created_at TEXT NOT NULL,
            completed_at TEXT
        )
    """)

    cur.execute("""
        CREATE INDEX IF NOT EXISTS idx_pending_invites_username
        ON pending_user_invites(username)
    """)

    cur.execute("""
        CREATE INDEX IF NOT EXISTS idx_pending_invites_token
        ON pending_user_invites(token)
    """)
'''
if anchor not in text:
    raise RuntimeError('Database anchor not found')
text = text.replace(anchor, insert, 1)

# 3) Add pending-invite helpers before register_user().
anchor = '''# ============================================================
# تسجيل المستخدم
# ============================================================

def register_user(user):
'''
helper = '''# ============================================================
# إضافة مستخدم آمنة من لوحة الإدارة عبر Telegram username
# ============================================================

def normalize_telegram_username(value):
    value = (value or "").strip()
    if value.startswith("@"):
        value = value[1:]
    return value.strip().lower()


def create_pending_user_invite(username, admin_id):
    username = normalize_telegram_username(username)
    if not re.fullmatch(r"[A-Za-z0-9_]{5,32}", username):
        raise ValueError("Invalid Telegram username")

    conn = get_db()
    cur = conn.cursor()

    # إذا كان المستخدم معروفاً بالفعل، لا ننشئ سجلاً مكرراً.
    cur.execute("""
        SELECT user_id, username, first_name, last_name
        FROM users
        WHERE lower(username) = ?
        LIMIT 1
    """, (username,))
    existing = cur.fetchone()
    if existing:
        conn.close()
        return {"status": "existing", "user_id": existing["user_id"]}

    # ألغِ أي دعوة قديمة غير مكتملة لنفس الاسم، ثم أنشئ دعوة جديدة.
    cur.execute("""
        UPDATE pending_user_invites
        SET status = 'superseded'
        WHERE lower(username) = ?
          AND status = 'pending'
    """, (username,))

    token = uuid.uuid4().hex
    cur.execute("""
        INSERT INTO pending_user_invites (
            username, token, admin_id, status, created_at
        ) VALUES (?, ?, ?, 'pending', ?)
    """, (username, token, admin_id, datetime.now().isoformat()))

    conn.commit()
    invite_id = cur.lastrowid
    conn.close()
    return {"status": "pending", "id": invite_id, "username": username, "token": token}


def complete_pending_user_invite(token, user):
    token = (token or "").strip()
    if not token or not user:
        return False

    conn = get_db()
    cur = conn.cursor()
    cur.execute("""
        SELECT id, username
        FROM pending_user_invites
        WHERE token = ? AND status = 'pending'
        LIMIT 1
    """, (token,))
    invite = cur.fetchone()
    if not invite:
        conn.close()
        return False

    requested_username = normalize_telegram_username(invite["username"])
    actual_username = normalize_telegram_username(user.username)
    if not actual_username or actual_username != requested_username:
        conn.close()
        return False

    # register_user() سبق أن حفظ البيانات الحالية؛ هنا نربط الدعوة بالـ ID الحقيقي فقط.
    cur.execute("""
        UPDATE pending_user_invites
        SET status = 'completed', user_id = ?, completed_at = ?
        WHERE id = ? AND status = 'pending'
    """, (user.id, datetime.now().isoformat(), invite["id"]))
    conn.commit()
    conn.close()
    return True


# ============================================================
# تسجيل المستخدم
# ============================================================

def register_user(user):
'''
if anchor not in text:
    raise RuntimeError('register_user anchor not found')
text = text.replace(anchor, helper, 1)

# 4) Add instruction UI before show_video_menu().
anchor = '''async def show_video_menu(
    query,
    language
):
'''
instructions = '''async def show_instructions_menu(query, language):
    keyboard = InlineKeyboardMarkup([
        [InlineKeyboardButton(TEXTS[language]["instructions_copy"], callback_data="instructions_copy")],
        [InlineKeyboardButton(TEXTS[language]["instructions_share"], callback_data="instructions_share")],
        [InlineKeyboardButton(TEXTS[language]["instructions_search"], callback_data="instructions_search")],
        [InlineKeyboardButton(TEXTS[language]["instructions_back"], callback_data="main_menu")],
    ])
    await query.edit_message_text(
        TEXTS[language]["instructions_title"],
        reply_markup=keyboard,
    )


async def instructions_callback(update: Update, context: ContextTypes.DEFAULT_TYPE):
    query = update.callback_query
    await query.answer()
    user = update.effective_user
    register_user(user)
    if is_banned(user.id):
        await query.edit_message_text(TEXTS["ar"]["banned"])
        return
    language = get_language(user.id) or "ar"
    choice = query.data
    if choice == "instructions":
        await show_instructions_menu(query, language)
        return
    messages = {
        "instructions_copy": TEXTS[language]["instructions_copy_text"],
        "instructions_share": TEXTS[language]["instructions_share_text"],
        "instructions_search": TEXTS[language]["instructions_search_text"],
    }
    if choice in messages:
        await query.edit_message_text(
            messages[choice],
            reply_markup=InlineKeyboardMarkup([
                [InlineKeyboardButton(TEXTS[language]["instructions_back"], callback_data="instructions")],
                [InlineKeyboardButton(TEXTS[language]["instructions_back"], callback_data="main_menu")],
            ]),
        )


'''
if anchor not in text:
    raise RuntimeError('show_video_menu anchor not found')
text = text.replace(anchor, instructions + anchor, 1)

# 5) Add instructions button to the existing main menu without removing any existing buttons.
start = text.find('async def show_main_menu(')
end = text.find('async def show_video_menu(', start)
if start < 0 or end < 0:
    raise RuntimeError('show_main_menu function not found')
segment = text[start:end]
needle = '    keyboard = InlineKeyboardMarkup(['
if needle not in segment:
    raise RuntimeError('main menu keyboard not found')
# Insert one row immediately before the final main-menu closing marker by using the edit_message_text call boundary.
call_marker = '    await query.edit_message_text('
pos = segment.find(call_marker)
if pos < 0:
    raise RuntimeError('main menu render call not found')
# Find the last closing of keyboard construction before render call and insert there.
pre = segment[:pos]
last_close = pre.rfind('    ])')
if last_close < 0:
    raise RuntimeError('main menu keyboard close not found')
pre = pre[:last_close] + '        [\n            InlineKeyboardButton(\n                TEXTS[language]["instructions"],\n                callback_data="instructions"\n            )\n        ],\n\n' + pre[last_close:]
segment = pre + segment[pos:]
text = text[:start] + segment + text[end:]

# 6) Complete invite tokens on /start after registration. This never overwrites existing user data.
anchor = '''    register_user(user)
'''
pos = text.find(anchor)
if pos < 0:
    raise RuntimeError('start register_user call not found')
# Find the first start() function and insert only inside it.
start_pos = text.find('async def start(')
next_func = text.find('\nasync def ', start_pos + 1)
if start_pos < 0 or next_func < 0:
    raise RuntimeError('start function boundaries not found')
start_segment = text[start_pos:next_func]
reg_pos = start_segment.find(anchor)
if reg_pos < 0:
    raise RuntimeError('start registration anchor not found')
invite_code = '''    register_user(user)

    # ربط دعوة الإدارة بالـ Telegram ID الحقيقي بعد /start.
    start_args = context.args or []
    if start_args and start_args[0].startswith("add_"):
        complete_pending_user_invite(start_args[0][4:], user)
'''
start_segment = start_segment[:reg_pos] + invite_code + start_segment[reg_pos + len(anchor):]
text = text[:start_pos] + start_segment + text[next_func:]

# 7) Add admin "Add user" flow before admin_user_details().
anchor = '''async def admin_user_details(
    update: Update,
    context: ContextTypes.DEFAULT_TYPE
):
'''
flow = '''async def admin_add_user_callback(update: Update, context: ContextTypes.DEFAULT_TYPE):
    query = update.callback_query
    await query.answer()
    if update.effective_user.id != ADMIN_ID:
        return
    context.user_data["waiting_admin_add_user"] = True
    await query.edit_message_text(
        "➕ إضافة مستخدم للبوت\n\n"
        "أرسل الآن Telegram username للمستخدم.\n"
        "مثال: @username\n\n"
        "🔒 لن يتم اختلاق Telegram ID أو إنشاء حساب وهمي.\n"
        "إذا كان المستخدم معروفاً للبوت سيتم فتح حسابه مباشرة.\n"
        "وإذا لم يكن معروفاً، سيُنشأ رابط دعوة آمن ليربطه المستخدم عند فتح البوت."
    )


async def process_admin_add_user(update: Update, context: ContextTypes.DEFAULT_TYPE):
    if update.effective_user.id != ADMIN_ID:
        return
    if not context.user_data.get("waiting_admin_add_user"):
        return
    context.user_data["waiting_admin_add_user"] = False
    username = normalize_telegram_username(update.message.text)
    if not re.fullmatch(r"[A-Za-z0-9_]{5,32}", username):
        await update.message.reply_text("❌ Telegram username غير صالح. استخدم مثلاً @username")
        return

    try:
        result = create_pending_user_invite(username, ADMIN_ID)
    except ValueError:
        await update.message.reply_text("❌ Telegram username غير صالح.")
        return

    if result["status"] == "existing":
        await update.message.reply_text(
            "✅ المستخدم موجود بالفعل في قاعدة البيانات.\n\n"
            f"🆔 Telegram ID: {result['user_id']}",
            reply_markup=InlineKeyboardMarkup([
                [InlineKeyboardButton("👤 عرض المستخدم", callback_data=f"user_{result['user_id']}")],
                [InlineKeyboardButton("👥 المستخدمون", callback_data="admin_users_0")],
            ])
        )
        return

    bot_username = context.bot.username
    deep_link = f"https://t.me/{bot_username}?start=add_{result['token']}"
    await update.message.reply_text(
        "✅ تم إنشاء دعوة آمنة للمستخدم.\n\n"
        f"👤 username: @{result['username']}\n"
        "⏳ الحالة: بانتظار فتح البوت\n\n"
        "📎 أرسل هذا الرابط للمستخدم:"
        f"\n{deep_link}\n\n"
        "عند فتحه للرابط سيتم ربط الدعوة بالـ Telegram ID الحقيقي، ولن يتم فقد أو تعديل أي بيانات موجودة."
    )


'''
if anchor not in text:
    raise RuntimeError('admin_user_details anchor not found')
text = text.replace(anchor, flow + anchor, 1)

# 8) Add button to Users section.
anchor = '''    keyboard.append([\n\n        InlineKeyboardButton(\n            "🔍 بحث عن مستخدم",\n            callback_data="admin_search"\n        )\n\n    ])
'''
replacement = '''    keyboard.append([\n\n        InlineKeyboardButton(\n            "➕ إضافة مستخدم",\n            callback_data="admin_add_user"\n        )\n\n    ])
\n    keyboard.append([\n\n        InlineKeyboardButton(\n            "🔍 بحث عن مستخدم",\n            callback_data="admin_search"\n        )\n\n    ])
'''
if anchor not in text:
    raise RuntimeError('users search button anchor not found')
text = text.replace(anchor, replacement, 1)

# 9) Route the pending admin add-user text before normal admin text routing.
anchor = '''    if context.user_data.get(\n        "waiting_admin_search"\n    ):
'''
route = '''    if context.user_data.get(\n        "waiting_admin_add_user"\n    ):
\n        await process_admin_add_user(\n            update,\n            context\n        )
\n        return
\n    if context.user_data.get(\n        "waiting_admin_search"\n    ):
'''
if anchor not in text:
    raise RuntimeError('admin router search anchor not found')
text = text.replace(anchor, route, 1)

# 10) Register callback handler before admin_search.
anchor = '''    app.add_handler(\n        CallbackQueryHandler(\n            admin_search_callback,
            pattern=r"^admin_search$"
        )
    )
'''
handler = '''    app.add_handler(\n        CallbackQueryHandler(\n            instructions_callback,
            pattern=r"^instructions(?:_(?:copy|share|search))?$"
        )
    )
\n    app.add_handler(\n        CallbackQueryHandler(\n            admin_add_user_callback,
            pattern=r"^admin_add_user$"
        )
    )
\n''' + anchor
if anchor not in text:
    raise RuntimeError('admin_search handler anchor not found')
text = text.replace(anchor, handler, 1)

# Marker for idempotence and auditability.
text = '# ALIBOT_FEATURES_V1\n' + text
path.write_text(text, encoding='utf-8')
print('Feature patch applied.')
PY

      - name: Validate Python syntax
        run: python3 -m py_compile bot.py

      - name: Commit patched bot.py
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot.py
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "feat: add usage instructions and safe admin user invites"
            git push
          fi
