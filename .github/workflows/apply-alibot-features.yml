name: Apply AliBot features

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-features:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply feature patch
        run: python3 - <<'PY'
