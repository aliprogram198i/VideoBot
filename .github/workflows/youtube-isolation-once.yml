name: youtube-isolation-once

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply minimal source patch
        shell: python
        run: |
          from pathlib import Path
          import re
          path = Path('bot.py')
          text = path.read_text(encoding='utf-8')
          marker = 'youtube_smart_extraction_not_applicable'
          if marker in text:
              print('Patch already present')
          else:
              pattern = r'(?m)^(?P<indent>\s*)smart_file, smart_diagnostics = await download_with_smart_extraction\(\n(?P<body>.*?)(?P=indent)\)'
              matches = list(re.finditer(pattern, text, re.DOTALL))
              if len(matches) != 1:
                  raise SystemExit(f'Expected exactly one Smart Extraction call, found {len(matches)}')
              m = matches[0]
              indent = m.group('indent')
              original = m.group(0)
              call = original
              replacement = (
                  f'{indent}if is_youtube:\n'
                  f'{indent}    smart_file = None\n'
                  f'{indent}    smart_diagnostics = {{\n'
                  f'{indent}        "candidate_count": 0,\n'
                  f'{indent}        "valid_candidate_count": 0,\n'
                  f'{indent}        "skipped": "youtube_smart_extraction_not_applicable",\n'
                  f'{indent}    }}\n'
                  f'{indent}    print("ℹ️ Skipping generic Smart Extraction fallback for YouTube")\n'
                  f'{indent}else:\n'
                  + '\n'.join(indent + '    ' + line if line else line for line in call.splitlines())
                  + '\n'
              )
              path.write_text(text[:m.start()] + replacement + text[m.end():], encoding='utf-8')
              print('Applied minimal YouTube fallback isolation')
      - name: Verify source
        run: |
          python -m py_compile bot.py entrypoint.py
          python -m compileall -q jobs security plugins database media delivery telegram_layer downloader
          grep -n -A14 -B2 'youtube_smart_extraction_not_applicable' bot.py
      - name: Commit source patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet -- bot.py; then
            echo 'No source change'
            exit 0
          fi
          git add bot.py
          git commit -m 'fix: isolate YouTube from generic smart extraction fallback'
          git push origin HEAD:main
