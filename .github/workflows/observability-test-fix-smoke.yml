name: observability-test-fix-smoke

on:
  push:
    branches:
      - fix/observability-test-time-window

jobs:
  observability-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m pytest -q tests/test_admin_operations_observability.py
