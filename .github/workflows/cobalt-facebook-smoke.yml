name: cobalt-facebook-smoke
on:
  push:
    branches:
      - test/cobalt-facebook
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Resolve Facebook URL through existing Cobalt service
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error --max-time 60 \
            -H 'Accept: application/json' \
            -H 'Content-Type: application/json' \
            -d '{"url":"https://www.facebook.com/reel/2115871489331970","videoQuality":"max","audioFormat":"best","downloadMode":"auto","localProcessing":"disabled","disableMetadata":true}' \
            'https://cobalt-resolver-production.up.railway.app/' | tee /tmp/cobalt.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/cobalt.json'))
          print("STATUS:", d.get("status"))
          print("HAS_URL:", isinstance(d.get("url"), str) and d["url"].startswith(("http://","https://")))
          if d.get("status") not in {"redirect","tunnel","picker"}:
              raise SystemExit("Cobalt did not resolve the Facebook URL")
          PY
