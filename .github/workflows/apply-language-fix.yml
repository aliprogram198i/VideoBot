name: Apply isolated language selection fix

on:
  push:
    branches:
      - fix/language-selection-2026-09-12
    paths:
      - .github/workflows/apply-language-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/language-selection-2026-09-12
          fetch-depth: 1
      - name: Patch new-user language default
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("bot.py")
          text = path.read_text(encoding="utf-8")

          old = '''        INSERT INTO users (\n            user_id,\n            username,\n            first_name,\n            last_name,\n            first_seen,\n            last_seen\n        )\n        VALUES (?, ?, ?, ?, ?, ?)'''

          new = '''        INSERT INTO users (\n            user_id,\n            username,\n            first_name,\n            last_name,\n            first_seen,\n            last_seen,\n            language\n        )\n        VALUES (?, ?, ?, ?, ?, ?, NULL)'''

          if text.count(old) != 1:
              raise SystemExit(f"Expected exactly one register_user insert block; found {text.count(old)}")

          text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")
          PY

          python -m py_compile bot.py
          git diff --check
          git diff -- bot.py
      - name: Commit isolated fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot.py
          git commit -m "fix: show language selection for new users"
          git push origin HEAD:fix/language-selection-2026-09-12
